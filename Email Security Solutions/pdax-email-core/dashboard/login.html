<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Secure Email Gateway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    color-scheme: light dark;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-raised: #ffffff; --ink: #0b0b0b; --ink-secondary: #52514e;
    --ink-muted: #898781; --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.16); --accent: #4a3aa7;
    --accent-ink: #ffffff; --accent-wash: rgba(74, 58, 167, 0.08); --status-critical: #d03b3b;
    --status-critical-bg: rgba(208, 59, 59, 0.10);
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px -12px rgba(11, 11, 11, 0.18);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #171716; --surface-raised: #1e1e1c; --ink: #ffffff; --ink-secondary: #c3c2b7;
      --ink-muted: #8f8d86; --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
      --accent: #9085e9; --accent-ink: #14121f; --accent-wash: rgba(144, 133, 233, 0.14);
      --status-critical: #d03b3b; --status-critical-bg: rgba(230, 103, 103, 0.14);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(560px 380px at 15% 8%, var(--accent-wash), transparent 60%),
      radial-gradient(480px 320px at 88% 92%, var(--accent-wash), transparent 60%),
      var(--page);
    color: var(--ink);
    font: 15px/1.5 var(--font-sans);
    padding: 20px;
  }
  .wrap { width: min(380px, 100%); }
  .brand-lockup { display: flex; align-items: center; gap: 11px; margin: 0 2px 20px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
    display: grid; place-items: center; flex: none; box-shadow: var(--shadow);
  }
  .brand-mark svg { width: 19px; height: 19px; color: #fff; }
  .brand-name { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--ink-muted); letter-spacing: 0.02em; margin-top: 1px; }
  .card {
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px 28px 28px; box-shadow: var(--shadow);
  }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--ink-muted); font-size: 13px; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 11.5px; font-weight: 650; letter-spacing: 0.01em; color: var(--ink-secondary); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--page); color: var(--ink); font-size: 14px; font-family: inherit;
    transition: border-color 0.12s ease;
  }
  input::placeholder { color: var(--ink-muted); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px 12px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 650; cursor: pointer;
    font-family: inherit; transition: opacity 0.12s ease, transform 0.08s ease;
  }
  button:hover:not(:disabled) { opacity: 0.92; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: default; }
  .error {
    display: none; color: var(--status-critical); background: var(--status-critical-bg);
    font-size: 12.5px; margin-top: 14px; padding: 9px 11px; border-radius: 8px; line-height: 1.5;
  }
  .footnote { text-align: center; font-size: 11.5px; color: var(--ink-muted); margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-lockup">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9 6 9-6" /><rect x="3" y="5" width="18" height="14" rx="2" />
        </svg>
      </div>
      <div>
        <div class="brand-name" id="brandName">Secure Email Gateway Service (SEGS)</div>
        <div class="brand-sub">Gateway console</div>
      </div>
    </div>
    <form class="card" id="loginForm">
      <h1 id="formTitle">Sign in</h1>
      <p class="sub" id="formSub">Sign in to view mail arriving at the gateway.</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      <button type="submit" id="submitBtn">Sign in</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footnote">Access is role-gated — Admin, Analyst, or Viewer.</div>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("loginForm");
  var errorMsg = document.getElementById("errorMsg");
  var submitBtn = document.getElementById("submitBtn");
  var isSetup = false;

  fetch("/api/org").then(function (r) { return r.json(); }).then(function (org) {
    var el = document.getElementById("brandName");
    if (el && org.display_name) el.textContent = org.display_name + " Secure Email Gateway Service (SEGS)";
  }).catch(function () { /* keep the static default */ });

  fetch("/api/setup/status").then(function (r) { return r.json(); }).then(function (d) {
    if (d.needs_setup) {
      isSetup = true;
      document.getElementById("formTitle").textContent = "Create the first admin account";
      document.getElementById("formSub").textContent = "No accounts exist yet — this one-time setup creates the first Admin.";
      submitBtn.textContent = "Create admin account";
    }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.style.display = "none";
    submitBtn.disabled = true;
    var body = {
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    };
    fetch(isSetup ? "/api/setup" : "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || "Sign-in failed"); });
      return r.json();
    }).then(function () {
      window.location.href = "/index.html";
    }).catch(function (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = "block";
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
