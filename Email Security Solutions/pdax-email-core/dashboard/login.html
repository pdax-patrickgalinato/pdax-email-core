<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Secure Email Gateway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --page: #f0f4f8; --surface: #ffffff; --ink: #0f172a; --ink-secondary: #475569;
    --ink-muted: #94a3b8; --border: rgba(15,23,42,0.10); --border-strong: rgba(15,23,42,0.16);
    --accent: #0f766e; --accent-2: #0369a1; --accent-ink: #ffffff;
    --accent-wash: rgba(15, 118, 110, 0.10); --status-critical: #dc2626;
    --status-critical-bg: rgba(220, 38, 38, 0.10);
    --shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.25);
    --font: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0b1220; --surface: #111827; --ink: #f1f5f9; --ink-secondary: #cbd5e1;
      --ink-muted: #64748b; --border: rgba(248,250,252,0.08); --border-strong: rgba(248,250,252,0.16);
      --accent: #2dd4bf; --accent-2: #38bdf8; --accent-ink: #042f2e;
      --accent-wash: rgba(45, 181, 176, 0.14);
      --status-critical: #f87171; --status-critical-bg: rgba(248, 113, 113, 0.12);
      --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.65);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 480px at 10% -10%, var(--accent-wash), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(3,105,161,0.08), transparent 50%),
      var(--page);
    color: var(--ink);
    font: 15px/1.5 var(--font);
    padding: 20px;
  }
  .wrap { width: min(400px, 100%); }
  .brand-lockup { display: flex; align-items: center; gap: 12px; margin: 0 2px 22px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; flex: none; box-shadow: var(--shadow);
  }
  .brand-mark svg { width: 20px; height: 20px; color: #fff; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; }
  .brand-sub { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; font-weight: 500; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 26px; box-shadow: var(--shadow);
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 4px; }
  .sub { color: var(--ink-muted); font-size: 13.5px; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--page); color: var(--ink); font-size: 14px; font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:hover:not(:disabled) { filter: brightness(1.05); }
  button:disabled { opacity: 0.55; cursor: default; }
  .error {
    display: none; color: var(--status-critical); background: var(--status-critical-bg);
    font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 10px;
  }
  .footnote { text-align: center; font-size: 12px; color: var(--ink-muted); margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-lockup">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9 6 9-6" /><rect x="3" y="5" width="18" height="14" rx="2" />
        </svg>
      </div>
      <div>
        <div class="brand-name" id="brandName">Secure Email Gateway Service (SEGS)</div>
        <div class="brand-sub">Gateway console</div>
      </div>
    </div>
    <form class="card" id="loginForm">
      <h1 id="formTitle">Sign in</h1>
      <p class="sub" id="formSub">Sign in to view mail arriving at the gateway.</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
      <button type="submit" id="submitBtn">Sign in</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="footnote">Access is role-gated — Admin, Analyst, or Viewer.</div>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("loginForm");
  var errorMsg = document.getElementById("errorMsg");
  var submitBtn = document.getElementById("submitBtn");
  var isSetup = false;

  fetch("/api/org").then(function (r) { return r.json(); }).then(function (org) {
    var el = document.getElementById("brandName");
    if (el && org.display_name) el.textContent = org.display_name + " Secure Email Gateway Service (SEGS)";
  }).catch(function () {});

  fetch("/api/setup/status").then(function (r) { return r.json(); }).then(function (d) {
    if (d.needs_setup) {
      isSetup = true;
      document.getElementById("formTitle").textContent = "Create the first admin account";
      document.getElementById("formSub").textContent = "No accounts exist yet — this one-time setup creates the first Admin.";
      submitBtn.textContent = "Create admin account";
    }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.style.display = "none";
    submitBtn.disabled = true;
    var body = {
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    };
    fetch(isSetup ? "/api/setup" : "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || "Sign-in failed"); });
      return r.json();
    }).then(function () {
      window.location.href = "/index.html";
    }).catch(function (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = "block";
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
