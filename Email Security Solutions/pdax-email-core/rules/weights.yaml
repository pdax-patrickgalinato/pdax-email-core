# Stage sub-score weights and verdict thresholds.
# Tune these against the golden set (tests/run_eval.py) before enforcement.
# Hard overrides in verdict.py bypass this weighting for high-confidence cases.

weights:
  headers: 20
  sender: 15
  urls: 20
  deception: 20   # trusted-channel abuse / brand-vs-platform structure
  attachments: 15
  content_ai: 15
  intel: 20        # weight applies to non-hit degraded cases; a hit is a hard override

thresholds:
  malicious: 65
  suspicious: 45
  low: 20

# app/attachment_forensics.py's static_severity -> points added to the
# attachments stage's sub_score (Malware Scanning, TMES policy parity).
# CRITICAL isn't emitted by _severity() today (max is HIGH) — kept for
# forward compatibility, not currently reachable.
forensics_severity_points:
  NONE: 0
  LOW: 10
  MEDIUM: 30
  HIGH: 60
  CRITICAL: 85
