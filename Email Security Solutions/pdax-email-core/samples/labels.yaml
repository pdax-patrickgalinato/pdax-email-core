# Hand-labeled ground truth for the real captured mail in samples/ (as opposed
# to the synthetic hard-override fixtures in samples/fixtures/, which
# tests/test_core.py uses instead). tests/run_eval.py reads this file instead
# of relying on filename prefixes (the old clean_/phish_/bec_ convention broke
# when these 21 real .eml files replaced the original synthetic corpus).
#
# label: clean | suspicious | malicious
#   clean      -> expect CLEAN or LOW
#   suspicious | malicious -> expect SUSPICIOUS or MALICIOUS (both count as
#                              "the malicious class" for precision/recall,
#                              same as the old MAL_VERDICTS grouping)
#
# Labeled by reading each email's actual content/headers, cross-checked
# against the existing eml_analysis_agent.py reports in samples_output/
# where available (a separate LLM-driven tool with its own LOW/MEDIUM/HIGH/
# CRITICAL taxonomy — used as supporting evidence, not copied 1:1, since it's
# scoring a different question than this pipeline's verdict).
#
# As of 2026-08-13, the *current* pipeline does not yet verdict any of the
# suspicious/malicious-labeled rows as SUSPICIOUS/MALICIOUS (recall=0.00) —
# that gap is real and expected; closing it is what Phases 1-6 of the TMES
# policy-parity plan are for. run_eval.py's pass/fail gate is therefore keyed
# on FP=0 (no clean mail wrongly flagged), not per-row recall — see that
# script for details. Re-triage this file if a label turns out wrong once
# better detection makes the miss visible.

labels:
  "AWS Notification.eml":
    label: malicious
    why: >
      Claims to be from PDAX DevOps (devops@pdax.ph) but Reply-To diverges to
      cloud-abuse.org, and body asks the recipient to verify/log in. Reply-to
      hijack to a deliberately malicious-sounding domain plus credential
      request is a textbook internal-phish pattern.

  "BSPCMS-2026-6TWNFHN7SG - 2nd Follow Up_ Request for SOA and Emai.eml":
    label: clean
    why: >
      Personal yahoo.com sender pressing a dispute/escalation, but no
      credential-harvest link, no payment ask, no attachment payload — reads
      as a genuine (if heated) customer complaint. eml_analysis_agent.py
      independently scored this LOW (10/100).

  "Booking Confirmation - Sofitel Dubai The Palm - 22 July 2026.eml":
    label: suspicious
    why: >
      Claims accor.com but Return-Path/DKIM don't align (return_path_mismatch
      fired), and the CTA uses a URL shortener instead of an official domain.
      eml_analysis_agent.py scored this HIGH (85/100) for the same reasons.

  "Burpsuite Proposal.eml":
    label: suspicious
    why: >
      Cold vendor-outreach shape, but SPF softfail + no DKIM + embedded
      redirect + a high-entropy PDF attachment stack up enough auth/content
      weakness to warrant analyst review rather than auto-clean.

  "Cannot login even after reset password.eml":
    label: clean
    why: >
      Personal gmail.com sender describing a real login problem in their own
      words — no link, no attachment, no payment ask. Heuristic hits
      (credential_request/urgency_language) are keyword coincidence from
      describing a login issue, not phishing content.

  "City Ads Updated Collaterals.eml":
    label: suspicious
    why: >
      Gmail-hosted sender claiming a "City Ads" brand, return_path_mismatch,
      generic greeting, URL shortener. eml_analysis_agent.py scored this HIGH
      (85/100) for header_from_mismatch + suspicious_return_path.

  "Civil Case No. 065 Orders dated May 29 and June 1.eml":
    label: suspicious
    why: >
      Claims a PH judiciary domain but DKIM/ARC failed to verify and the
      attached PDF carries an OpenAction directive (auto-executing content).
      eml_analysis_agent.py's own playbook classified it Suspicious.

  "Claire Morgan.eml":
    label: malicious
    why: >
      Copyright-infringement-notice lure (a well-known malware/phish pretext)
      from a university domain unrelated to "Claire Morgan," with a deliberate
      whitespace-padding evasion structure (content_padding_evasion) — a
      built-to-evade-scoring tell, not incidental formatting.

  "ClaireMorgan (1).eml":
    label: malicious
    why: "Duplicate of Claire Morgan.eml — same lure, same reasoning."

  "ClaireMorgan.eml":
    label: malicious
    why: "Duplicate of Claire Morgan.eml — same lure, same reasoning."

  "I can't register an account; it always tells me there's an error.eml":
    label: clean
    why: >
      Personal gmail.com sender describing a genuine registration error, no
      links/attachments/red flags at all.

  "atiu04082026.eml":
    label: clean
    why: >
      PH government domain (dswd.gov.ph) inviting to a legitimate-shaped
      virtual summit, no red flags.

  "atiu103252026.eml":
    label: clean
    why: >
      Gmail-hosted webinar invite (data-privacy training) — return_path
      mismatch only, generic educational content, no ask for
      credentials/money/attachments. Borderline but low-risk either way.

  "audric.sy.eml":
    label: malicious
    why: >
      Vague "more details" subject from a marketing-sounding throwaway domain
      (vertriebskosten-senken.net), urgency language, and an embedded redirect
      that unwraps to an unrelated domain — classic malspam/redirect-chain
      shape.

  "aws@edukasyon.ph.eml":
    label: clean
    why: "Legitimate-shaped company newsletter/marketing send, no red flags."

  "candys5188.eml":
    label: suspicious
    why: >
      Claims "PDAX Support" but arrives as an unprefixed Fwd (fake_reply_prefix
      — a documented thread-hijack evasion tell in this codebase), rather than
      a genuine internal support thread.

  "catt.eml":
    label: clean
    why: "Real business/sales outreach content, no red flags."

  "christoff.graza@pdax.ph.eml":
    label: clean
    why: >
      Internal workplace@pdax.ph quarantine notification — a system message,
      not attacker-controlled content.

  "Bird Facts.EML":
    label: clean
    why: "Benign off-topic content, no red flags beyond a DKIM body-hash quirk."

  "Boost Code Quality Now, Pdax.EML":
    label: clean
    why: "Plausible real vendor (Codacy) sales email, no red flags."

  "Coinbase wants to share travel rule data for a transaction.EML":
    label: clean
    why: >
      Internal PDAX compliance-alias notification about Travel Rule data
      sharing — a routine VASP compliance workflow message, not attacker
      content. reply_to_divergent is the only signal and is explainable by
      routing through a compliance mailbox.
