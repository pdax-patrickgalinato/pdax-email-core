# Organization identity — the pieces of "who this deployment is for" that
# had no home before (Phase 13, white-labeling): a display name and a short
# regulator/context description fed into app/pipeline/content_ai.py's
# system prompt. Everything else that's already org-specific config
# (protected domains, watched VIP names) stays in its own existing file —
# backend/policy/identity/protected_domains.txt, backend/policy/identity/vip_names.txt
# — this file only adds what those didn't already cover.
#
# To deploy this for a different organization: edit display_name and
# regulator_context here, then edit those identity list files with that
# organization's own domains/names. No code changes needed anywhere.

organization:
  display_name: ""
  regulator_context: "a BSP-regulated crypto exchange"
