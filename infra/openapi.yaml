components:
  schemas:
    BenignBody:
      properties:
        queue_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Queue Id
        note:
          title: Note
          default: ''
          type: string
          nullable: true
      type: object
      required:
      - queue_id
      title: BenignBody
    Body_analyze_eml_api_analyze_eml_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_analyze_eml_api_analyze_eml_post
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 256
          minLength: 8
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
    ContextNoteCreate:
      properties:
        text:
          type: string
          maxLength: 2000
          minLength: 1
          title: Text
      type: object
      required:
      - text
      title: ContextNoteCreate
    CreateUserRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9._@\-]+$
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 8
          title: Password
        role:
          type: string
          title: Role
      type: object
      required:
      - username
      - password
      - role
      title: CreateUserRequest
    CredentialBody:
      properties:
        credential:
          additionalProperties: true
          type: object
          minProperties: 1
          title: Credential
        name:
          type: string
          maxLength: 64
          title: Name
          default: Passkey
        unlock:
          type: boolean
          title: Unlock
          default: false
        queue_id:
          type: string
          maxLength: 256
          title: Queue Id
          default: ''
      type: object
      required:
      - credential
      title: CredentialBody
    EmailViewBody:
      properties:
        queue_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Queue Id
        event:
          type: string
          enum:
          - open
          - leave
          - download
          title: Event
          default: leave
        dwell_ms:
          type: integer
          maximum: 86400000.0
          minimum: 0.0
          title: Dwell Ms
          default: 0
        subject:
          type: string
          maxLength: 500
          title: Subject
          default: ''
        from_addr:
          type: string
          maxLength: 320
          title: From Addr
          default: ''
      type: object
      required:
      - queue_id
      title: EmailViewBody
    EnforcementUpdate:
      properties:
        mode:
          type: string
          title: Mode
      type: object
      required:
      - mode
      title: EnforcementUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportBody:
      properties:
        pack:
          additionalProperties: true
          type: object
          title: Pack
      type: object
      required:
      - pack
      title: ImportBody
    IngestUpdate:
      properties:
        gmail_fetch:
          type: boolean
          title: Gmail Fetch
      type: object
      required:
      - gmail_fetch
      title: IngestUpdate
    ListEntry:
      properties:
        type:
          type: string
          enum:
          - address
          - domain
          title: Type
        value:
          type: string
          title: Value
        note:
          title: Note
          default: ''
          type: string
          nullable: true
      type: object
      required:
      - type
      - value
      title: ListEntry
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 256
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    LoginWebauthnRequest:
      properties:
        login_token:
          type: string
          maxLength: 256
          minLength: 8
          title: Login Token
        credential:
          additionalProperties: true
          type: object
          minProperties: 1
          title: Credential
        name:
          type: string
          maxLength: 64
          title: Name
          default: Passkey
      type: object
      required:
      - login_token
      - credential
      title: LoginWebauthnRequest
    NotifyConfigUpdate:
      properties:
        enabled:
          type: boolean
          title: Enabled
        smtp_host:
          type: string
          title: Smtp Host
          default: ''
        smtp_port:
          type: integer
          title: Smtp Port
          default: 587
        smtp_user:
          type: string
          title: Smtp User
          default: ''
        from_addr:
          type: string
          title: From Addr
          default: segs-alerts@pdax.ph
        threshold:
          type: string
          enum:
          - SUSPICIOUS
          - MALICIOUS
          title: Threshold
          default: SUSPICIOUS
      type: object
      required:
      - enabled
      title: NotifyConfigUpdate
    PolicyUpdate:
      properties:
        category:
          type: string
          title: Category
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - category
      - enabled
      title: PolicyUpdate
    ResetPasswordRequest:
      properties:
        password:
          type: string
          maxLength: 256
          minLength: 8
          title: Password
      type: object
      required:
      - password
      title: ResetPasswordRequest
    RetryAiBody:
      properties:
        queue_ids:
          title: Queue Ids
          items:
            type: string
          type: array
          maxItems: 100
          nullable: true
      type: object
      title: RetryAiBody
    SetupRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9._@\-]+$
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 8
          title: Password
      type: object
      required:
      - username
      - password
      title: SetupRequest
    SlackConfigUpdate:
      properties:
        enabled:
          type: boolean
          title: Enabled
        webhook_url:
          type: string
          title: Webhook Url
          default: ''
        threshold:
          type: string
          enum:
          - SUSPICIOUS
          - MALICIOUS
          title: Threshold
          default: SUSPICIOUS
      type: object
      required:
      - enabled
      title: SlackConfigUpdate
    SpotlightSearchBody:
      properties:
        q:
          type: string
          maxLength: 500
          minLength: 1
          title: Q
        verdict:
          type: string
          maxLength: 32
          title: Verdict
          default: ''
      type: object
      required:
      - q
      title: SpotlightSearchBody
    SsoConfigUpdate:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: false
        issuer:
          type: string
          title: Issuer
          default: https://oauth.id.jumpcloud.com
        authorization_endpoint:
          type: string
          title: Authorization Endpoint
          default: ''
        token_endpoint:
          type: string
          title: Token Endpoint
          default: ''
        userinfo_endpoint:
          type: string
          title: Userinfo Endpoint
          default: ''
        client_id:
          type: string
          title: Client Id
          default: ''
        client_secret:
          type: string
          title: Client Secret
          default: ''
        allowed_domains:
          type: string
          title: Allowed Domains
          default: pdax.ph
        default_role:
          type: string
          enum:
          - viewer
          - analyst
          - admin
          title: Default Role
          default: viewer
      type: object
      title: SsoConfigUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateful JWT (RFC 6750). Same token as the seg_session cookie; jti is stored
        server-side.
    cookieAuth:
      type: apiKey
      in: cookie
      name: seg_session
      description: Session cookie set at login. Same credential as Bearer.
    scimBearer:
      type: http
      scheme: bearer
      description: SCIM 2.0 bearer (SEG_SCIM_BEARER_TOKEN) or an admin JWT.
  x-amazon-apigateway-integrations:
    alb:
      type: HTTP_PROXY
      httpMethod: ANY
      connectionType: VPC_LINK
      connectionId: "${vpc_link_id}"
      uri: "${alb_listener_arn}"
      payloadFormatVersion: '1.0'
      timeoutInMillis: 30000
